<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">AiTraceRoot Pioneer Badge</title>
  <desc id="desc">Animated Pioneer Badge with a compass star, orbit rings, and a clean luminous badge frame.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1b3542"/>
      <stop offset="48%" stop-color="#071014"/>
      <stop offset="100%" stop-color="#020405"/>
    </radialGradient>
    <linearGradient id="steel" x1="20%" y1="12%" x2="80%" y2="88%">
      <stop offset="0%" stop-color="#f5fbff"/>
      <stop offset="36%" stop-color="#8ca6b7"/>
      <stop offset="72%" stop-color="#233644"/>
      <stop offset="100%" stop-color="#e9f7ff"/>
    </linearGradient>
    <linearGradient id="signal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ff8ff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffc857"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.35 0 0 0 0 0.9 0 0 0 0 1 0 0 0 0.8 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g transform="translate(512 512)" filter="url(#softShadow)">
    <circle r="408" fill="#0a1216" stroke="#1f3340" stroke-width="3"/>
    <circle r="356" fill="#0e1a20" stroke="url(#steel)" stroke-width="18"/>
    <circle r="292" fill="#101e25" stroke="#243946" stroke-width="2"/>

    <g opacity="0.82">
      <circle r="238" fill="none" stroke="#72e7ff" stroke-width="3" stroke-dasharray="18 22">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle r="196" fill="none" stroke="#ffc857" stroke-width="3" stroke-dasharray="10 26">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g filter="url(#glow)">
      <path d="M0 -230 L48 -54 L224 0 L48 54 L0 230 L-48 54 L-224 0 L-48 -54 Z" fill="url(#signal)">
        <animateTransform attributeName="transform" attributeType="XML" type="scale" values="1;1.035;1" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M0 -142 L30 -30 L142 0 L30 30 L0 142 L-30 30 L-142 0 L-30 -30 Z" fill="#061015" opacity="0.94"/>
      <circle r="54" fill="#f8fafc"/>
      <circle r="22" fill="#0a171d">
        <animate attributeName="r" values="18;26;18" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g opacity="0.72">
      <circle cx="0" cy="-238" r="9" fill="#8ff8ff">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="238" cy="0" r="9" fill="#ffc857">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="238" r="9" fill="#8ff8ff">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-238" cy="0" r="9" fill="#ffc857">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
